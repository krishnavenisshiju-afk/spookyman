<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spider-Man | Marvel</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Social Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Background watermark text -->
        <div class="watermark">MARVEL</div>

        <!-- Left Content Section -->
        <main class="content-section">
            <div class="logo">
                <span class="marvel-text">MARVEL</span>
            </div>

            <div class="bio">
                <h1 class="hero-title">SPIDER-MAN</h1>
                <p class="hero-desc">
                    He is a crime-fighting hero in the Marvel universe. Peter Parker gained his powers by being bitten by a radioactive spider and follows the motto "With great power comes great responsibility."
                </p>
            </div>

            <footer class="social-links">
                <a href="#" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
                <a href="#" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
                <a href="#" aria-label="X (Twitter)"><i class="fa-brands fa-x-twitter"></i></a>
                <a href="#" aria-label="YouTube"><i class="fa-brands fa-youtube"></i></a>
            </footer>
        </main>

        <!-- Center Image Section -->
        <div class="hero-image-wrapper">
            <!-- Cutout background angle -->
            <div class="hero-bg-slant"></div>
            <!-- Main Character Image -->
            <img src="https://wallpapers.com/images/hd/spider-man-ps4-action-pose-83e9b0y3g213f56e.png" alt="Spider-Man" class="hero-image">
        </div>

        <!-- Right Red Accent Polygon -->
        <div class="red-accent"></div>
    </div>
</body>
</html>
